# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Gradle and the Kotlin compiler have to run on JDK 17-21: Kotlin 2.1 cannot parse a newer major
# version and fails with "IllegalArgumentException: 25.0.5". Point Gradle at such a JDK through
# JAVA_HOME or ~/.gradle/gradle.properties (see README) - the path differs on every machine, so it
# is deliberately not committed here.
